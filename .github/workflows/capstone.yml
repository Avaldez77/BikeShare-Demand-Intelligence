name: Bike-share demand intelligence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.3"
          use-public-rspm: true
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run end-to-end pipeline on the attributed UCI data
        run: python -m bikeshare --output-dir build
      - name: Verify delivery artifacts and audit trail
        run: |
          python -c "import json; from pathlib import Path; root=Path('build'); summary=json.loads((root/'delivery/delivery_summary.json').read_text()); metrics=json.loads((root/'model/forecast_metrics.json').read_text()); assert summary['email_sent'] is False; assert metrics['test_rows'] > 0; assert (root/'analytics/briefing.html').is_file(); assert (root/'delivery/manifest.json').is_file(); print('End-to-end artifact checks passed.')"
